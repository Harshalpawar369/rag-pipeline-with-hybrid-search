# Local development stack: Postgres with pgvector, Redis, and the API.
# The API runs migrations on start. Use `docker compose up --build`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legalrag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalrag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      MIGRATE_DSN: postgresql://postgres:postgres@postgres:5432/legalrag
      PG_DSN: postgresql://legalrag_app:legalrag_app@postgres:5432/legalrag
      REDIS_URL: redis://redis:6379/0
      EMBED_DIM: "1024"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ALLOW_REGISTRATION: "true"
    ports: ["8000:8000"]
    volumes: ["blobs:/app/data/blobs"]

volumes:
  pgdata:
  blobs:
